[package]
name = "linux-mcp"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "linux-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "0.12", features = ["schemars"] }
tokio = { version = "1.49", features = ["full"] }
sysinfo = "0.37"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nix = { version = "0.30.1", features = ["user"] }
dirs = "6.0.0"
toml = "0.9.10"
chrono = "0.4.42"
